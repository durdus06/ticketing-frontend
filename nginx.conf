server {
    # Listen on the unprivileged HTTP port.
    listen 8080;

    server_name _;

    # Serve the compiled React application.
    root /usr/share/nginx/html;
    index index.html;

    # Disable unnecessary server version disclosure.
    server_tokens off;

    # Prevent MIME-type sniffing.
    add_header X-Content-Type-Options "nosniff" always;

    # Support React Router and client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache fingerprinted Vite assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Always revalidate the HTML entry point.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}