name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict default GitHub token permissions.
permissions:
  contents: read

jobs:
  validate:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      # Check out the repository source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js 24 and enable npm caching.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Install dependencies from package-lock.json.
      - name: Install dependencies
        run: npm ci

      # Run ESLint checks.
      - name: Lint
        run: npm run lint

      # Compile TypeScript and build the React application.
      - name: Build
        run: npm run build

  publish:
    name: Docker Build & Publish
    needs: validate
    runs-on: ubuntu-latest

    # Publish images only after successful pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      # Check out the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configure Docker Buildx.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Authenticate to GitHub Container Registry.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate latest and commit-specific image tags.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/durdus06/ticketing-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # Build and publish the frontend Docker image.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max